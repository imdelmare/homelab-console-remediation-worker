name: homelab-console-remediation-worker

services:
  worker:
    build:
      context: .
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.18.8}
    image: ${WORKER_IMAGE:-homelab-console-remediation-worker:local}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    environment:
      HOME: /var/lib/homelab-console-remediation-worker
      XDG_CACHE_HOME: /var/lib/homelab-console-remediation-worker/cache
      XDG_CONFIG_HOME: /var/lib/homelab-console-remediation-worker/config
      XDG_DATA_HOME: /var/lib/homelab-console-remediation-worker/data
      XDG_STATE_HOME: /var/lib/homelab-console-remediation-worker/state
      ENGINE: ${ENGINE:-opencode}
    volumes:
      - ./config.toml:/etc/homelab-console-remediation-worker/config.toml:ro
      - ./secrets/mcp-token:/run/secrets/mcp-token:ro
      - ./secrets/auth.json:/var/lib/homelab-console-remediation-worker/data/auth.json:ro
    tmpfs:
      - /run/homelab-console-remediation-worker:rw,noexec,nosuid,nodev,mode=0700,uid=10001,gid=10001
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
      - /var/lib/homelab-console-remediation-worker/cache:rw,noexec,nosuid,nodev,mode=0700,uid=10001,gid=10001
      - /var/lib/homelab-console-remediation-worker/config:rw,noexec,nosuid,nodev,mode=0700,uid=10001,gid=10001
      - /var/lib/homelab-console-remediation-worker/state:rw,noexec,nosuid,nodev,mode=0700,uid=10001,gid=10001
    stop_grace_period: 30s
