services:
  worker:
    volumes: !override
      - ./config.toml:/etc/homelab-console-remediation-worker/config.toml:ro
      - ./secrets/mcp-token:/run/secrets/mcp-token:ro
      - ./codex-home:/home/worker:rw
      - ./codex-config:/home/worker/.codex:rw
    environment:
      HOME: /home/worker
      CODEX_HOME: /home/worker/.codex
