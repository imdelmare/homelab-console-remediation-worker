[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-console-remediation-worker"
version = "0.2.2"
description = "Lease-fenced remediation worker for Homelab Console"
requires-python = ">=3.12"
dependencies = [
  "mcp==1.28.1",
  "httpx==0.28.1",
  "pydantic==2.11.7",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0", "PyYAML==6.0.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
